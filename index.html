    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fluxoclaro_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-teal-600/20 selection:text-teal-900 dark:selection:text-teal-100">

    <script type="module" src="/src/main.tsx"></script>
  </body>
